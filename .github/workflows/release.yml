name: Release

# Manual releases only: run from the Actions tab (on main). The run builds and tests the
# solution, lets semantic-release compute the next version from the Conventional Commits
# since the last tag, then packs and publishes the packages when a release was cut.
on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  build:
    # ubuntu runners ship with Docker, which the integration tests need: they start a
    # PostgreSQL container per run via Testcontainers.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore JsonApiPoc.sln

      - name: Build
        run: dotnet build JsonApiPoc.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test JsonApiPoc.sln --no-build --configuration Release --verbosity normal

  semantic-release:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v4
        with:
          extra_plugins: |
            @semantic-release/changelog
            @semantic-release/git
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}

  pack:
    needs: semantic-release
    if: needs.semantic-release.outputs.new_release_published == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore JsonApiPoc.sln

      - name: Build
        run: dotnet build JsonApiPoc.sln --no-restore --configuration Release

      - name: Pack JsonApiKit
        run: |
          dotnet pack libs/JsonApiKit/JsonApiKit.csproj \
            --no-build \
            --configuration Release \
            -p:Version=${{ needs.semantic-release.outputs.new_release_version }} \
            --output ./artifacts

      - name: Pack JsonApiKit.OpenApi
        run: |
          dotnet pack libs/JsonApiKit.OpenApi/JsonApiKit.OpenApi.csproj \
            --no-build \
            --configuration Release \
            -p:Version=${{ needs.semantic-release.outputs.new_release_version }} \
            --output ./artifacts

      - name: Pack JsonApiKit.Testing
        run: |
          dotnet pack libs/JsonApiKit.Testing/JsonApiKit.Testing.csproj \
            --no-build \
            --configuration Release \
            -p:Version=${{ needs.semantic-release.outputs.new_release_version }} \
            --output ./artifacts

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: ./artifacts/*.nupkg

  publish:
    needs: pack
    runs-on: ubuntu-latest
    permissions:
      id-token: write # enable GitHub OIDC token issuance for NuGet Trusted Publishing

    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: ./artifacts

      # Trusted Publishing: exchange the GitHub OIDC token for a NuGet API key valid for
      # 1 hour, per the policy configured on nuget.org for this repo + workflow file.
      - name: NuGet login (OIDC -> temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet Gallery
        run: |
          dotnet nuget push ./artifacts/*.nupkg \
            --api-key ${{ steps.login.outputs.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
