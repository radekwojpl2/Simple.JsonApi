name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    # ubuntu runners ship with Docker, which the integration tests need: they start a
    # PostgreSQL container per run via Testcontainers.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore JsonApiPoc.sln

      - name: Build
        run: dotnet build JsonApiPoc.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test JsonApiPoc.sln --no-build --configuration Release --verbosity normal

      - name: Check for vulnerable packages
        run: dotnet list JsonApiPoc.sln package --vulnerable --include-transitive
