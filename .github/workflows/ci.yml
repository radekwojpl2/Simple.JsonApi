name: CI

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    # ubuntu runners ship with Docker, which the integration tests need: they start a
    # PostgreSQL container per run via Testcontainers.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore JsonApiPoc.sln

      - name: Build
        run: dotnet build JsonApiPoc.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test JsonApiPoc.sln --no-build --configuration Release --verbosity normal

      - name: Check for vulnerable packages
        run: dotnet list JsonApiPoc.sln package --vulnerable --include-transitive

  publish-preview:
    # Every pull request to main also ships a preview of the packages to nuget.org, so the
    # branch's changes can be consumed before the merge. The version comes from the latest
    # release tag with the patch bumped and a -preview.<pr>.<run> suffix — semantic-release
    # is not involved; it only versions real releases from main.
    if: github.event_name == 'pull_request'
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read # a job-level permissions block drops everything unlisted, checkout included
      id-token: write # enable GitHub OIDC token issuance for NuGet Trusted Publishing
      pull-requests: write # comment the published preview version on the PR

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the preview version is derived from the latest v* tag

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Compute preview version
        id: version
        run: |
          BASE=$(git describe --tags --abbrev=0 --match 'v*' | sed 's/^v//')
          IFS=. read -r MAJOR MINOR PATCH <<< "$BASE"
          VERSION="$MAJOR.$MINOR.$((PATCH + 1))-preview.${{ github.event.pull_request.number }}.${{ github.run_number }}"
          echo "Preview version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore JsonApiPoc.sln

      - name: Build
        run: dotnet build JsonApiPoc.sln --no-restore --configuration Release

      - name: Pack
        run: |
          for project in libs/JsonApiKit/JsonApiKit.csproj \
                         libs/JsonApiKit.OpenApi/JsonApiKit.OpenApi.csproj \
                         libs/JsonApiKit.Testing/JsonApiKit.Testing.csproj; do
            dotnet pack "$project" \
              --no-build \
              --configuration Release \
              -p:Version=${{ steps.version.outputs.version }} \
              --output ./artifacts
          done

      - name: NuGet login (OIDC -> temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push preview packages
        run: |
          dotnet nuget push ./artifacts/*.nupkg \
            --api-key ${{ steps.login.outputs.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      # One sticky comment per PR: the first publish creates it, later publishes update it
      # in place (found via the marker) instead of piling up a comment per push.
      - name: Comment published version on the PR
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          MARKER="<!-- preview-packages -->"
          BODY=$(printf '%s\n' \
            "$MARKER" \
            "📦 Preview packages published to nuget.org as **$VERSION**:" \
            "" \
            '```' \
            "dotnet add package Simple.JsonApi --version $VERSION" \
            "dotnet add package Simple.JsonApi.OpenApi --version $VERSION" \
            "dotnet add package Simple.JsonApi.Testing --version $VERSION" \
            '```' \
            "" \
            "_Packages can take a few minutes to appear while nuget.org validates and indexes them._")
          COMMENT_ID=$(gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
            --jq ".[] | select(.body | startswith(\"$MARKER\")) | .id" | head -1)
          if [ -n "$COMMENT_ID" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$COMMENT_ID" -f body="$BODY"
          else
            gh api -X POST "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" -f body="$BODY"
          fi
